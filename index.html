<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>My Task Manager</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <h1>My Task Manager</h1>

        <form id="task-form">
            <input
            id="task-input"
            type="text"
            placeholder="What do you need to do?"
            >
            <label for="task-priority">Priority:</label>

            <select id="task-priority">
                <option value="low">Low</option>
                <option value="medium" selected>Medium</option>
                <option value="high">High</option>
            </select>

            <label for="task-category">Category:</label>

            <select id="task-category">
                <option value="work">Work</option>
                <option value="personal">Personal</option>
                <option value="learning">Learning</option>
                <option value="projects">Projects</option>
            </select>

            <label for="task-deadline">Deadline:</label>
            <input type="date" id="task-deadline">

            <button type="submit">Add task</button>
        </form>
    <div class="task-controls">

        <input
            id="search-input"
            type="text"
            placeholder="search tasks..."
            >

        <div class="sort-control">
            <label for="sort-select">Sort tasks:</label>

            <select id="sort-select">
                <option value="newest">Newest first</option>
                <option value="oldest">Oldest first</option>
                <option value="priority">Highest priority first</option>
            </select>


            <label for="category-filter">Filter by category</label>

            <select id="category-filter">
                <option value="all">All Categories</option>
                <option value="work">Work</option>
                <option value="personal">Personal</option>
                <option value="learning">Learning</option>
                <option value="projects">Projects</option>
            </select>

        </div>

         <div id="filter-buttons">
                <button type="button" data-filter="all">All</button>
                <button type="button" data-filter="active">Active</button>
                <button type="button" data-filter="completed">Completed</button>
        </div>
    </div>
        
            

           

        <p id="message"></p>
        <div id="task-count">
            <p>All: <span id="all-count">0</span></p>
            <p>Active: <span id="active-count">0</span></p>
            <p>Completed: <span id="completed-count">0</span></p>
        </div>
        <ul id="task-list"></ul>

        <script src="app.js" defer></script>
    </body>
</html>
